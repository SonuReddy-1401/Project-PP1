<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Football Analytics Dashboard — Coach-Readable Layer</title>
  
  <!-- Load Plotly.js from cdnjs CDN host as strictly required -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.29.1/plotly.min.js"></script>
  
  <!-- Design System Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Fixed Left Sidebar (~230px) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">StatsBomb / Opta Suite</div>
      <div class="sidebar-title">
        <span class="team-badge-swatch" id="sidebar-swatch"></span>
        <span id="sidebar-team-name">Napoli Analytics</span>
      </div>
    </div>
    <nav>
      <ul class="nav-list">
        <li class="nav-item"><button class="active" onclick="switchTab('overview', this)">Overview</button></li>
        <li class="nav-item"><button onclick="switchTab('heatmap', this)">Team Heatmap</button></li>
        <li class="nav-item"><button onclick="switchTab('shape', this)">Team Shape</button></li>
        <li class="nav-item"><button onclick="switchTab('thirds', this)">Pitch Thirds</button></li>
        <li class="nav-item"><button onclick="switchTab('trajectory', this)">Team Trajectory</button></li>
        <li class="nav-item"><button onclick="switchTab('players', this)">Individual Players</button></li>
        <li class="nav-item"><button onclick="switchTab('methodology', this)">Data Quality & Methodology</button></li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content Container (Rendered Dynamically via Modular Component JS) -->
  <main class="main-content">
    <section id="overview" class="section active"></section>
    <section id="heatmap" class="section"></section>
    <section id="shape" class="section"></section>
    <section id="thirds" class="section"></section>
    <section id="trajectory" class="section"></section>
    <section id="players" class="section"></section>
    <section id="methodology" class="section"></section>
  </main>

  <!-- JavaScript Modules -->
  <script src="js/utils.js"></script>
  <script src="js/components/overview.js"></script>
  <script src="js/components/heatmap.js"></script>
  <script src="js/components/shape.js"></script>
  <script src="js/components/thirds.js"></script>
  <script src="js/components/trajectory.js"></script>
  <script src="js/components/players.js"></script>
  <script src="js/components/methodology.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
