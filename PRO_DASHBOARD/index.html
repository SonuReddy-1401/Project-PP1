<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO Match Command Center — SSC Napoli vs AS Roma</title>

  <!-- Load Plotly.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.29.1/plotly.min.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="dark">

  <!-- Top Match Command Header Bar -->
  <header class="match-header-bar">
    <div class="match-brand">
      <span class="league-badge">SERIE A HUB</span>
      <div class="match-fixture-title">
        SSC Napoli <span class="fixture-vs">VS</span> AS Roma
      </div>
    </div>

    <div class="match-clock-pill">
      <span class="live-pulse"></span>
      MATCH CLOCK: 9:54 – 24:54
    </div>

    <div class="header-actions">
      <button class="nav-link" style="border: 1px solid var(--border-subtle); padding: 6px 12px;" onclick="toggleTheme()">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="theme-toggle-lbl">Light Mode</span>
      </button>
    </div>
  </header>

  <!-- App Shell -->
  <div class="app-shell">
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="nav-group-title">Match Analytics</div>
      <ul class="nav-menu">
        <li>
          <button class="nav-link active" onclick="switchTab('overview')">
            <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Match Overview
          </button>
        </li>
        <li>
          <button class="nav-link" onclick="switchTab('heatmap')">
            <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg>
            Spatial Heatmap
          </button>
        </li>
        <li>
          <button class="nav-link" onclick="switchTab('shape')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>
            Team Shape
          </button>
        </li>
        <li>
          <button class="nav-link" onclick="switchTab('thirds')">
            <svg class="nav-icon" viewBox="0 0 24 24"><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            Pitch Thirds
          </button>
        </li>
        <li>
          <button class="nav-link" onclick="switchTab('trajectory')">
            <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Centroid Trajectory
          </button>
        </li>
        <li>
          <button class="nav-link" onclick="switchTab('players')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Player Analytics
          </button>
        </li>
      </ul>

      <div class="nav-group-title" style="margin-top: 24px;">Pipeline Audit</div>
      <ul class="nav-menu">
        <li>
          <button class="nav-link" onclick="switchTab('audit')">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Methodology Audit
          </button>
        </li>
      </ul>
    </aside>

    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
      <section id="view-overview" class="view-section active"></section>
      <section id="view-heatmap" class="view-section"></section>
      <section id="view-shape" class="view-section"></section>
      <section id="view-thirds" class="view-section"></section>
      <section id="view-trajectory" class="view-section"></section>
      <section id="view-players" class="view-section"></section>
      <section id="view-audit" class="view-section"></section>
    </main>

  </div>

  <!-- Application Logic Scripts -->
  <script src="js/pitch-canvas.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
