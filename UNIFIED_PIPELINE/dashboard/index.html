<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Tactical Football Analytics Command Center</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Plotly CDN -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  
  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="dark">

  <div class="app-shell">
    <!-- Top Navigation Header -->
    <header class="top-nav">
      <div class="nav-brand">
        <div class="brand-badge" id="header-league-badge">MATCH ANALYTICS</div>
        <div class="match-title" id="header-match-title">Loading Match Data...</div>
      </div>

      <div class="nav-center">
        <div class="match-clock-chip" id="header-clock-chip">
          <span class="pulse-dot"></span>
          <span id="header-clock-text">MATCH CLOCK</span>
        </div>
      </div>

      <div class="nav-right">
        <button id="sidebar-toggle" class="btn-sidebar-toggle" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <button id="theme-toggle" class="btn-theme-toggle">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span id="theme-label">Toggle Mode</span>
        </button>
      </div>
    </header>

    <!-- Main Content Shell -->
    <div class="main-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="app-sidebar">
        <div class="nav-group">
          <div class="nav-section-title">MATCH ANALYTICS</div>
          <button class="nav-item active" data-view="overview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Match Overview
          </button>
          <button class="nav-item" data-view="heatmap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            Spatial Heatmap
          </button>
          <button class="nav-item" data-view="shape">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Team Shape
          </button>
          <button class="nav-item" data-view="thirds">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
            Pitch Thirds
          </button>
          <button class="nav-item" data-view="trajectory">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
            Centroid Trajectory
          </button>
          <button class="nav-item" data-view="players">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Player Analytics
          </button>
        </div>

        <div class="nav-group" style="margin-top: auto;">
          <div class="nav-section-title">PIPELINE AUDIT</div>
          <button class="nav-item" data-view="audit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Methodology Audit
          </button>
        </div>
      </aside>

      <!-- View Containers -->
      <main class="content-body">
        <div id="view-overview" class="view-panel active"></div>
        <div id="view-heatmap" class="view-panel"></div>
        <div id="view-shape" class="view-panel"></div>
        <div id="view-thirds" class="view-panel"></div>
        <div id="view-trajectory" class="view-panel"></div>
        <div id="view-players" class="view-panel"></div>
        <div id="view-audit" class="view-panel"></div>
      </main>
    </div>
  </div>

  <!-- Dashboard JavaScript Modules -->
  <script src="js/pitch-canvas.js"></script>
  <script src="js/components.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
